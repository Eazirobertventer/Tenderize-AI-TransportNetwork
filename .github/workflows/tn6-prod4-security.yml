name: TN6-PROD-4 Security Boundary

on:
  pull_request:
  workflow_dispatch:

jobs:
  prove-public-read-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check live/server.mjs
          node --check apps/transport-api/src/server.mjs
      - name: Prove read-only method gates
        run: |
          grep -Fq "method_not_allowed" live/server.mjs
          grep -Fq "method_not_allowed" apps/transport-api/src/server.mjs
          grep -Fq "'GET','HEAD'" live/server.mjs
          grep -Fq "'GET','HEAD'" apps/transport-api/src/server.mjs
      - name: Backup worker syntax
        run: |
          python -m py_compile ops/postgres-backup/backup.py ops/postgres-backup/restore.py
          grep -Fq "pg_dump" ops/postgres-backup/backup.py
          grep -Fq "pg_restore" ops/postgres-backup/restore.py

      - name: Prove public proxy allowlist
        run: |
          grep -Fq "/api/v1/ranks" live/server.mjs
          grep -Fq "/api/v1/routes" live/server.mjs
          grep -Fq "/api/v1/route-candidates" live/server.mjs
          ! grep -Fq "/api/v1/data-issues" live/server.mjs
          ! grep -Fq "/api/v1/reconciliation/rank-candidates" live/server.mjs
          ! grep -Fq "/api/v1/route-candidates/association-evidence" live/server.mjs
