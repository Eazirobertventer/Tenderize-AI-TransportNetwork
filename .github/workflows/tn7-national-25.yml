name: TN7 NATIONAL-25 KZN Route and Rank Source Acquisition

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-25-source-acquisition.json'
      - 'apps/kzn-licence-corpus-worker/kzn-national-25-source-acquisition.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'test/tn7-national-25-static.mjs'
      - '.github/workflows/tn7-national-25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national25-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/kzn-national-25-source-acquisition.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
      - name: NATIONAL-25 static safety gate
        run: node test/tn7-national-25-static.mjs
