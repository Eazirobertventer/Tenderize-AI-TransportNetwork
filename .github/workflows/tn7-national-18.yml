name: TN7 NATIONAL-18 KZN Post-Canonical Unlock

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/kzn-post-canonical-unlock.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'test/tn7-national-18-static.mjs'
      - '.github/workflows/tn7-national-18.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national18-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/kzn-post-canonical-unlock.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
      - name: NATIONAL-18 static safety gate
        run: node test/tn7-national-18-static.mjs
