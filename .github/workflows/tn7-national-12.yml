name: TN7 NATIONAL-12 KZN Evidence Backlog

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/evidence-backlog.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'apps/kzn-licence-corpus-worker/test-national-12-backlog.mjs'
      - 'test/tn7-national-12-static.mjs'
      - '.github/workflows/tn7-national-12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national12-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/evidence-backlog.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
          node --check apps/kzn-licence-corpus-worker/test-national-12-backlog.mjs
      - name: Backlog unit proof
        run: node apps/kzn-licence-corpus-worker/test-national-12-backlog.mjs
      - name: NATIONAL-12 static safety gate
        run: node test/tn7-national-12-static.mjs
