name: TN7 NATIONAL-27-R2-R4 Provincial Road Crosswalk

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r4-crosswalk.json'
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r4-crosswalk.mjs'
      - 'test/tn7-national-27-r2-r4-static.mjs'
      - '.github/workflows/tn7-national-27-r2-r4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national27-r2-r4-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-27-r2-r4-crosswalk.mjs
      - name: NATIONAL-27-R2-R4 static gate
        run: node test/tn7-national-27-r2-r4-static.mjs

  national27-r2-r4-runtime:
    runs-on: ubuntu-latest
    needs: national27-r2-r4-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute documentary crosswalk elimination
        run: |
          rm -rf artifacts/tn7-national-27-r2-r4
          node apps/kzn-licence-corpus-worker/tn7-national-27-r2-r4-crosswalk.mjs 2>&1 | tee national27-r2-r4.log
      - name: Classify R4 outcome
        run: |
          if ! grep -q 'TN7_NATIONAL_27_R2_R4_RUNTIME_PASS' national27-r2-r4.log; then
            echo "TN7_NATIONAL_27_R2_R4_RUNTIME_FAIL"
            exit 1
          fi
          if grep -q 'TN7_NATIONAL_27_R2_R4_CROSSWALK_READY' national27-r2-r4.log; then
            echo "TN7_NATIONAL_27_R2_R4_RUNTIME_READY"
          else
            echo "TN7_NATIONAL_27_R2_R4_RUNTIME_HOLD"
          fi
      - name: Upload R4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tn7-national-27-r2-r4-evidence
          path: |
            artifacts/tn7-national-27-r2-r4
            national27-r2-r4.log
          if-no-files-found: error
