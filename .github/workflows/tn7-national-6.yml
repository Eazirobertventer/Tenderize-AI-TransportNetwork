name: TN7 NATIONAL-6 Bhamshela Identity Resolution

on:
  pull_request:
    paths:
      - 'apps/transport-api/data/kzn-bhamshela-appelsbosch-identity-evidence.json'
      - 'apps/transport-api/src/association-identity-resolution.mjs'
      - 'apps/transport-api/src/kzn-bhamshela-identity.mjs'
      - 'apps/transport-api/src/server.mjs'
      - 'test/tn7-national-6-static.mjs'
      - '.github/workflows/tn7-national-6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national6-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/transport-api/src/association-identity-resolution.mjs
          node --check apps/transport-api/src/kzn-bhamshela-identity.mjs
          node --check apps/transport-api/src/server.mjs
      - name: NATIONAL-6 static safety gate
        run: node test/tn7-national-6-static.mjs
