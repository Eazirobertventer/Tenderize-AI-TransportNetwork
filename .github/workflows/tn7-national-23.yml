name: TN7 NATIONAL-23 KZN Mbazwana ADJ5 Readiness

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-23-mbazwana-adj5.mjs'
      - 'test/tn7-national-23-static.mjs'
      - '.github/workflows/tn7-national-23.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national23-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-23-mbazwana-adj5.mjs
      - name: NATIONAL-23 static safety gate
        run: node test/tn7-national-23-static.mjs
