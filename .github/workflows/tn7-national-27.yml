name: TN7 NATIONAL-27 Authoritative Feature Execution

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-authoritative-feature-execution.mjs'
      - 'test/tn7-national-27-static.mjs'
      - '.github/workflows/tn7-national-27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national27-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-27-authoritative-feature-execution.mjs
      - name: NATIONAL-27 static safety gate
        run: node test/tn7-national-27-static.mjs

  national27-source-execution:
    runs-on: ubuntu-latest
    needs: national27-static
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute authoritative KZN feature queries
        id: execute
        run: |
          set +e
          node apps/kzn-licence-corpus-worker/tn7-national-27-authoritative-feature-execution.mjs | tee national27-result.jsonl
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify execution outcome
        run: |
          if grep -q 'TN7_NATIONAL_27_AUTHORITATIVE_FEATURE_EXECUTION_PASS' national27-result.jsonl; then
            echo "TN7_NATIONAL_27_RUNTIME_PASS"
          elif grep -q 'TN7_NATIONAL_27_SOURCE_EXECUTION_BLOCKED' national27-result.jsonl; then
            echo "TN7_NATIONAL_27_RUNTIME_BLOCKED_BY_SOURCE"
          else
            echo "TN7_NATIONAL_27_RUNTIME_UNCLASSIFIED"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tn7-national-27-authoritative-feature-result
          path: national27-result.jsonl
          if-no-files-found: error
