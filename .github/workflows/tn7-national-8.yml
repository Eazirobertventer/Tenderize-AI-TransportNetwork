name: TN7 NATIONAL-8 KZN High-Volume Corpus

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/evidence-execution-framework.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-sources.json'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'apps/kzn-licence-corpus-worker/test-national-8-framework.mjs'
      - 'apps/kzn-licence-corpus-worker/package.json'
      - 'apps/transport-api/src/kzn-corpus-plan.mjs'
      - 'apps/transport-api/src/server.mjs'
      - 'test/tn7-national-8-static.mjs'
      - '.github/workflows/tn7-national-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national8-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/evidence-execution-framework.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
          node --check apps/kzn-licence-corpus-worker/test-national-8-framework.mjs
          node --check apps/transport-api/src/kzn-corpus-plan.mjs
          node --check apps/transport-api/src/server.mjs
      - name: Framework unit proof
        run: node apps/kzn-licence-corpus-worker/test-national-8-framework.mjs
      - name: NATIONAL-8 static safety gate
        run: node test/tn7-national-8-static.mjs
