name: TN7 NATIONAL-27-R2-R2 Gluckstadt and Road Recovery

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r2-manifest.json'
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r2-recovery.mjs'
      - 'test/tn7-national-27-r2-r2-static.mjs'
      - '.github/workflows/tn7-national-27-r2-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national27-r2-r2-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-27-r2-r2-recovery.mjs
      - name: NATIONAL-27-R2-R2 static gate
        run: node test/tn7-national-27-r2-r2-static.mjs

  national27-r2-r2-runtime:
    runs-on: ubuntu-latest
    needs: national27-r2-r2-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute disambiguation and spatial recovery
        run: |
          rm -rf artifacts/tn7-national-27-r2-r2
          node apps/kzn-licence-corpus-worker/tn7-national-27-r2-r2-recovery.mjs 2>&1 | tee national27-r2-r2.log
      - name: Classify R2-R2 outcome
        run: |
          if ! grep -q 'TN7_NATIONAL_27_R2_R2_RUNTIME_PASS' national27-r2-r2.log; then
            echo "TN7_NATIONAL_27_R2_R2_RUNTIME_FAIL"
            exit 1
          fi
          if grep -q 'TN7_NATIONAL_27_R2_R2_ROAD_IDENTITY_READY' national27-r2-r2.log; then
            echo "TN7_NATIONAL_27_R2_R2_RUNTIME_READY"
          else
            echo "TN7_NATIONAL_27_R2_R2_RUNTIME_PARTIAL"
          fi
      - name: Upload R2-R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tn7-national-27-r2-r2-evidence
          path: |
            artifacts/tn7-national-27-r2-r2
            national27-r2-r2.log
          if-no-files-found: error
