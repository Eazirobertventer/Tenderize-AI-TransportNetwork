name: TN7 NATIONAL-7 Bhamshela Canonicalisation

on:
  pull_request:
    paths:
      - 'apps/transport-api/src/kzn-bhamshela-canonicalisation.mjs'
      - 'apps/transport-api/src/server.mjs'
      - 'test/tn7-national-7-static.mjs'
      - '.github/workflows/tn7-national-7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national7-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/transport-api/src/kzn-bhamshela-canonicalisation.mjs
          node --check apps/transport-api/src/server.mjs
      - name: NATIONAL-7 static safety gate
        run: node test/tn7-national-7-static.mjs
