name: TN7 NATIONAL-19 KZN Deterministic Target Recovery

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/kzn-rank-target-recovery.mjs'
      - 'apps/kzn-licence-corpus-worker/kzn-target-recovery.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'apps/transport-api/src/route-evidence-gap-recovery.mjs'
      - 'test/tn7-national-19-static.mjs'
      - '.github/workflows/tn7-national-19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national19-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/kzn-rank-target-recovery.mjs
          node --check apps/kzn-licence-corpus-worker/kzn-target-recovery.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
      - name: NATIONAL-19 static safety gate
        run: node test/tn7-national-19-static.mjs
