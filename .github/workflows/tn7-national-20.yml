name: TN7 NATIONAL-20 KZN Source Recovery

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-20-source-recovery.json'
      - 'apps/kzn-licence-corpus-worker/kzn-source-recovery.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'test/tn7-national-20-static.mjs'
      - '.github/workflows/tn7-national-20.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national20-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/kzn-source-recovery.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
      - name: NATIONAL-20 static safety gate
        run: node test/tn7-national-20-static.mjs
