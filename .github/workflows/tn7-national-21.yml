name: TN7 NATIONAL-21 KZN Alias and Source Expansion

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-21-evidence.json'
      - 'apps/kzn-licence-corpus-worker/tn7-national-21-alias-proposal.mjs'
      - 'test/tn7-national-21-static.mjs'
      - '.github/workflows/tn7-national-21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national21-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-21-alias-proposal.mjs
      - name: NATIONAL-21 static safety gate
        run: node test/tn7-national-21-static.mjs
