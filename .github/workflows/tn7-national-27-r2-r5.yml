name: TN7 NATIONAL-27-R2-R5 Historical Alias Recovery

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r5-alias-recovery.json'
      - 'apps/kzn-licence-corpus-worker/tn7-national-27-r2-r5-alias-recovery.mjs'
      - 'test/tn7-national-27-r2-r5-static.mjs'
      - '.github/workflows/tn7-national-27-r2-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national27-r2-r5-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/kzn-licence-corpus-worker/tn7-national-27-r2-r5-alias-recovery.mjs
      - name: NATIONAL-27-R2-R5 static gate
        run: node test/tn7-national-27-r2-r5-static.mjs

  national27-r2-r5-runtime:
    runs-on: ubuntu-latest
    needs: national27-r2-r5-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute historical alias recovery
        run: |
          rm -rf artifacts/tn7-national-27-r2-r5
          node apps/kzn-licence-corpus-worker/tn7-national-27-r2-r5-alias-recovery.mjs 2>&1 | tee national27-r2-r5.log
      - name: Classify R5 outcome
        run: |
          if ! grep -q 'TN7_NATIONAL_27_R2_R5_RUNTIME_PASS' national27-r2-r5.log; then
            echo "TN7_NATIONAL_27_R2_R5_RUNTIME_FAIL"
            exit 1
          fi
          if grep -q 'TN7_NATIONAL_27_R2_R5_ALIAS_READY' national27-r2-r5.log; then
            echo "TN7_NATIONAL_27_R2_R5_RUNTIME_READY"
          else
            echo "TN7_NATIONAL_27_R2_R5_RUNTIME_HOLD"
          fi
      - name: Upload R5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tn7-national-27-r2-r5-evidence
          path: |
            artifacts/tn7-national-27-r2-r5
            national27-r2-r5.log
          if-no-files-found: error
