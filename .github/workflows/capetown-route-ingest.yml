name: Cape Town Route Ingest Proof

on:
  pull_request:
  workflow_dispatch:

jobs:
  prove-route-ingest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transport_network
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transport -d transport_network"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: transport
      DATABASE_URL: postgresql://transport:transport@127.0.0.1:5432/transport_network
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply schema
        run: |
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/001_initial.sql
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/002_relation_candidates.sql
      - name: Install route worker
        working-directory: apps/route-worker
        run: npm install --no-audit --no-fund
      - name: First Cape Town route import
        working-directory: apps/route-worker
        run: npm run ingest
      - name: Save first counts
        run: |
          psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route" > /tmp/first_routes
          psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from source_record where entity_type='taxi_route'" > /tmp/first_sources
      - name: Second Cape Town route import
        working-directory: apps/route-worker
        run: npm run ingest
      - name: Prove idempotency and official geometry
        run: |
          first_routes=$(cat /tmp/first_routes)
          first_sources=$(cat /tmp/first_sources)
          second_routes=$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route")
          second_sources=$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from source_record where entity_type='taxi_route'")
          official=$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route where geometry_status='official_geometry' and verification_status='official'")
          test "$first_routes" -gt 0
          test "$first_routes" = "$second_routes"
          test "$first_sources" = "$second_sources"
          test "$official" = "$second_routes"