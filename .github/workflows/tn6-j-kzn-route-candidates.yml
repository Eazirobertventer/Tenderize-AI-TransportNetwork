name: TN6-J KZN Exact Route Candidates

on:
  pull_request:
  workflow_dispatch:

jobs:
  prove-route-candidate-staging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transport_network
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transport -d transport_network"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: transport
      DATABASE_URL: postgresql://transport:transport@127.0.0.1:5432/transport_network

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply schemas
        run: |
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/001_initial.sql
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/003_source_route_geometry.sql
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/004_route_candidates.sql

      - name: Seed exact-pair fixture
        run: |
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f test/fixtures/tn6-j-kzn-route-candidates.sql

      - name: Install worker
        working-directory: apps/kzn-route-worker
        run: npm install --no-audit --no-fund

      - name: Dry-run
        working-directory: apps/kzn-route-worker
        env:
          ROUTE_CANDIDATE_DRY_RUN: "true"
        run: |
          npm run build:route-candidates | tee /tmp/tn6j-dry.log
          grep -q '"event":"tn6_j_route_candidate_dry_run"' /tmp/tn6j-dry.log
          grep -q '"eligible":1' /tmp/tn6j-dry.log

      - name: Prove dry-run writes nothing
        run: |
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from route_candidate")" = "0"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route")" = "0"

      - name: Apply candidate build
        working-directory: apps/kzn-route-worker
        run: npm run build:route-candidates

      - name: Prove staging boundary
        run: |
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from route_candidate")" = "1"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from route_candidate where reconciliation_status='exact_endpoint_pair'")" = "1"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route")" = "0"

      - name: Prove idempotency
        working-directory: apps/kzn-route-worker
        run: |
          npm run build:route-candidates
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from route_candidate")" = "1"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route")" = "0"
