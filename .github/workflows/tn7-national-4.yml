name: TN7 NATIONAL-4 KZN Deterministic Adjudication

on:
  pull_request:
    paths:
      - 'apps/transport-api/src/kzn-deterministic-adjudication.mjs'
      - 'apps/transport-api/src/server.mjs'
      - 'test/tn7-national-4-static.mjs'
      - '.github/workflows/tn7-national-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national4-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/transport-api/src/kzn-deterministic-adjudication.mjs
          node --check apps/transport-api/src/server.mjs
      - name: NATIONAL-4 static safety gate
        run: node test/tn7-national-4-static.mjs
