name: TN7 NATIONAL-26 Gluckstadt Control Point and Mbazwana Road Acquisition

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-26-control-point-road-acquisition.json'
      - 'apps/kzn-licence-corpus-worker/kzn-national-26-control-point-road-acquisition.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs'
      - 'test/tn7-national-26-static.mjs'
      - '.github/workflows/tn7-national-26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national26-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/kzn-national-26-control-point-road-acquisition.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-8-corpus.mjs
      - name: NATIONAL-26 static safety gate
        run: node test/tn7-national-26-static.mjs
