name: TN7 NATIONAL-16 KZN Approval Readiness Review

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-16-review.mjs'
      - 'apps/transport-api/src/operator-association-create.mjs'
      - 'apps/transport-api/src/operator-proposals.mjs'
      - 'db/015_kzn_gazette_source_registry.sql'
      - 'test/tn7-national-16-static.mjs'
      - '.github/workflows/tn7-national-16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national16-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/tn7-national-16-review.mjs
          node --check apps/transport-api/src/operator-association-create.mjs
          node --check apps/transport-api/src/operator-proposals.mjs
      - name: NATIONAL-16 static safety gate
        run: node test/tn7-national-16-static.mjs
