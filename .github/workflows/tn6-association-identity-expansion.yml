name: TN6 NLTIS Association Identity Expansion

on:
  pull_request:
  workflow_dispatch:

jobs:
  prove-association-identity-ingest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: transport_network
          POSTGRES_USER: transport
          POSTGRES_PASSWORD: transport
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transport -d transport_network"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: transport
      DATABASE_URL: postgresql://transport:transport@127.0.0.1:5432/transport_network

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax
        run: node --check apps/nltis-worker/ingest-associations.mjs

      - name: Apply schema
        run: |
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/001_initial.sql
          psql -h 127.0.0.1 -U transport -d transport_network -v ON_ERROR_STOP=1 -f db/002_relation_candidates.sql

      - name: Install NLTIS worker
        working-directory: apps/nltis-worker
        run: npm install --no-audit --no-fund

      - name: First association identity ingest
        working-directory: apps/nltis-worker
        run: npm run ingest:associations

      - name: Prove association identities only
        run: |
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_association")" = "9"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_association where verification_status='documented'")" = "9"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_route")" = "0"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from source_record where entity_type='taxi_association'")" = "9"

      - name: Second association identity ingest
        working-directory: apps/nltis-worker
        run: npm run ingest:associations

      - name: Prove idempotency
        run: |
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from taxi_association")" = "9"
          test "$(psql -h 127.0.0.1 -U transport -d transport_network -Atc "select count(*) from source_record where entity_type='taxi_association'")" = "9"
