name: TN7 NATIONAL-15 KZN Association Proposal Batch

on:
  pull_request:
    paths:
      - 'apps/kzn-licence-corpus-worker/tn7-national-15-proposal-batch.mjs'
      - 'apps/kzn-licence-corpus-worker/tn7-national-15-schema-apply.mjs'
      - 'test/tn7-national-15-static.mjs'
      - '.github/workflows/tn7-national-15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  national15-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check apps/kzn-licence-corpus-worker/tn7-national-15-proposal-batch.mjs
          node --check apps/kzn-licence-corpus-worker/tn7-national-15-schema-apply.mjs
      - name: NATIONAL-15 static safety gate
        run: node test/tn7-national-15-static.mjs
